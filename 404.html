<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сторінку не знайдено — Катерина Онокало</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A1C3B">
<script>
// GitHub Pages serves this for every missing path. A work link (w/<id>.html) whose preview page isn't built
// yet (the workflow runs every 30 min) still opens the work on the site; anything else offers the home page.
(function () {
  var p = location.pathname;
  var m = p.match(/^(.*\/)w\/([A-Za-z0-9-]+?)(?:\.html)?\/?$/);
  var gh = /\.github\.io$/i.test(location.hostname);
  var base = m ? m[1] : (gh ? (p.match(/^\/[^\/]+\//) || ['/'])[0] : '/');
  if (m) { location.replace(base + '#work-' + m[2]); return; }
  window.__home = base;
})();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0A1C3B; color: #E9E4DC; font: 300 17px/1.6 "Commissioner", system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font: 300 clamp(30px, 5vw, 46px)/1.1 "Cormorant Garamond", Georgia, serif; margin: 0 0 14px; }
  a { color: #E07A4F; }
</style>
</head>
<body>
<div>
  <h1>Сторінку не знайдено</h1>
  <p><a id="home" href="https://kateonokalo.com/">На головну ⟶</a></p>
</div>
<script>if (window.__home) document.getElementById('home').href = window.__home;</script>
</body>
</html>
