<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Адмін · Катерина Онокало</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<script src="./supabase-config.js"></script>
<script src="vendor/supabase.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Commissioner", system-ui, sans-serif; font-weight: 300; background: #E9E4DC; color: #1B1A16; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 80px; }
  .card { background: #F4F0E8; border: 1px solid rgba(27,26,22,.12); border-radius: 14px; padding: 22px; }
  h1 { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 26px; letter-spacing: .02em; }
  h2 { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 19px; margin-bottom: 6px; }
  .muted { color: #857F74; font-size: 13.5px; line-height: 1.5; }
  input, select, textarea { width: 100%; background: #E9E4DC; border: 1px solid rgba(27,26,22,.25); border-radius: 10px; padding: 12px 14px; font: inherit; font-size: 15px; color: #1B1A16; margin-top: 6px; }
  textarea { line-height: 1.5; resize: vertical; }
  label { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #5A554C; margin-bottom: 14px; }
  button { font: inherit; font-weight: 500; cursor: pointer; }
  .btn { border: none; border-radius: 10px; padding: 13px 22px; font-size: 13px; letter-spacing: .08em; }
  .btn-dark { background: #0A1C3B; color: #E9E4DC; }
  .btn-line { background: none; border: 1px solid rgba(27,26,22,.3); color: #1B1A16; }
  .btn-danger { background: #B4501C; color: #FFF; }
  .btn:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 12px; align-items: center; }
  .tabs { display: flex; gap: 8px; margin: 22px 0 16px; flex-wrap: wrap; }
  .tab { border: 1px solid rgba(27,26,22,.3); background: none; border-radius: 999px; padding: 10px 18px; font-size: 13px; letter-spacing: .05em; }
  .tab.active { background: #0A1C3B; color: #E9E4DC; border-color: #0A1C3B; }
  .item { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; background: #F4F0E8; border: 1px solid rgba(27,26,22,.12); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .item img, .thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: #DCD5C9; }
  .item .thumb { display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-size: 20px; color: #B4501C; }
  .item .t { font-size: 15.5px; }
  .item .s { font-size: 12.5px; color: #857F74; margin-top: 3px; }
  .item .price { font-size: 14.5px; font-weight: 500; }
  .item .ops { display: flex; gap: 6px; flex-wrap: wrap; }
  .ops button { border: 1px solid rgba(27,26,22,.25); background: none; border-radius: 8px; padding: 7px 10px; font-size: 12.5px; }
  .ops button:hover { border-color: #0A1C3B; }
  .hidden-tag { color: #B4501C; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-left: 8px; }
  .new-tag { color: #9A7A55; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-left: 8px; }
  /* painting status: В наявності / Резерв / Продано (settings.status) */
  .seg { display: inline-flex; margin-top: 8px; border: 1px solid rgba(27,26,22,.25); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: none; padding: 6px 12px; font-size: 12.5px; font-weight: 400; color: #3B3830; }
  .seg button + button { border-left: 1px solid rgba(27,26,22,.15); }
  .seg button.on { background: #0A1C3B; color: #E9E4DC; }
  .seg button.on[data-st="sold"] { background: #B4501C; }
  .seg button.on[data-st="reserved"] { background: #9A7A55; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0A1C3B; color: #E9E4DC; padding: 12px 22px; border-radius: 999px; font-size: 13.5px; display: none; z-index: 50; max-width: 92vw; text-align: center; }
  .note { background: #F6E7DC; border: 1px solid rgba(180,80,28,.25); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; line-height: 1.5; color: #5A3A26; }
  .extra { margin-bottom: 16px; }
  /* «Інструкція» tab: Kateryna's guide as an accordion */
  .tab-help { border-style: dashed; }
  .help { background: #F4F0E8; border: 1px solid rgba(27,26,22,.12); border-radius: 12px; margin-bottom: 8px; }
  .help summary { cursor: pointer; list-style: none; padding: 15px 18px; font-family: Georgia, 'Times New Roman', serif; font-size: 17px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .help summary::-webkit-details-marker { display: none; }
  .help summary::after { content: "+"; flex: none; font-size: 22px; line-height: 1; color: #B4501C; transition: transform .2s; }
  .help[open] summary::after { transform: rotate(45deg); }
  .help summary:focus-visible { outline: 2px solid #B4501C; outline-offset: -2px; border-radius: 12px; }
  .help-body, .help-intro { font-size: 14.5px; line-height: 1.6; color: #2B2924; }
  .help-body { padding: 0 18px 14px; }
  .help-body p, .help-body ul, .help-body ol, .help-intro p { margin: 0 0 10px; }
  .help-body ul, .help-body ol { padding-left: 20px; }
  .help-body li { margin-bottom: 6px; }
  .help code { background: #E9E4DC; padding: 1px 6px; border-radius: 5px; font-size: 13px; }
  .help-body a, .help-intro a { color: #B4501C; word-break: break-all; }
  .extra .card + .card { margin-top: 12px; }
  #editor, #hallEditor { position: fixed; inset: 0; background: rgba(10,28,59,.6); display: none; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; z-index: 40; }
  #editor .card, #hallEditor .card { max-width: 620px; width: 100%; max-height: 92vh; overflow-y: auto; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } .item { grid-template-columns: 52px 1fr; } .item img, .item .thumb { width: 52px; height: 52px; } .item .ops { grid-column: 1 / -1; } }
</style>

<body>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const CFG = window.SUPABASE_CONFIG || {};
const CONFIG_OK = CFG.url && CFG.anonKey;
const BUCKET = "items";
const TOOLS = /[?&]tools\b/.test(location.search);
const NEW_TITLE = { paintings: "Нова картина", postcards: "Нова листівка", boxes: "Новий товар", projects: "Нове фото", workshops: "Нове фото" };
// Photo-only sections: no title/price, photos are added several at a time.
const PHOTO_ONLY = ["projects", "workshops"];
const photoOnly = (c) => PHOTO_ONLY.includes(c);

// English names of the original built-in halls (used when a hall has no English name in the «Зали» tab).
const HALLS = {
  "Зала I · Абстракція": "Hall I · Abstraction",
  "Зала II · Квіти й поля": "Hall II · Flowers & Fields",
  "Зала III · Україна": "Hall III · Ukraine",
  "Зала IV · Поп-образи": "Hall IV · Pop & Characters"
};

let sb = null;
let cat = "paintings";
let editingId = null;
let editingHallId = null;
let rows = [];
let halls = [];
let settings = {};
let settingsOk = true;
let busy = false;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function toast(msg, sticky) {
  const t = $("#toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(toast._t);
  if (!sticky) toast._t = setTimeout(() => t.style.display = "none", 3200);
}

function newId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0, v = c === "x" ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}

function byOrder(a, b) { return (a.sort_order || 0) - (b.sort_order || 0); }
function ofCat(c) { return rows.filter(x => (x.cat || "paintings") === c).sort(byOrder); }
function nextOrder(c) { return ofCat(c).reduce((m, d) => Math.max(m, d.sort_order || 0), 0) + 1; }

// ---------- Photos ----------
// Every upload is stored as "<id>/<stamp>-<w>x<h>-full.<ext>" plus a "-thumb" copy (800px) for grids.
// A fresh name per upload means no overwrite conflicts and no stale caches; the site reads the size from the name.

function thumbOf(url) { return String(url || "").replace(/-full\.(webp|jpe?g)(?=$|\?)/i, "-thumb.$1"); }
function isOptimized(url) { return /-\d+x\d+-full\.(webp|jpe?g)(?=$|\?)/i.test(String(url || "")); }

function loadImage(blob) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("браузер не зміг відкрити це фото (спробуйте JPG або PNG)")); };
    img.src = url;
  });
}

function canvasBlob(canvas, type, quality) {
  return new Promise((resolve) => canvas.toBlob(resolve, type, quality));
}

// Safari cannot encode WebP (toBlob silently returns PNG), so fall back to JPEG there.
async function encodeImage(img, max) {
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const scale = Math.min(1, max / Math.max(iw, ih));
  const w = Math.max(1, Math.round(iw * scale)), h = Math.max(1, Math.round(ih * scale));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, w, h);
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0, w, h);
  let blob = await canvasBlob(c, "image/webp", 0.82);
  if (blob && blob.type === "image/webp") return { blob, w, h, ext: "webp", type: "image/webp" };
  blob = await canvasBlob(c, "image/jpeg", 0.85);
  if (!blob) throw new Error("не вдалося стиснути фото");
  return { blob, w, h, ext: "jpg", type: "image/jpeg" };
}

async function putFile(path, enc) {
  const signed = await sb.storage.from(BUCKET).createSignedUploadUrl(path);
  if (signed.error) throw new Error("Створення посилання для фото: " + (signed.error.message || signed.error));
  const res = await fetch(signed.data.signedUrl, {
    method: "PUT",
    headers: { "Content-Type": enc.type, "Cache-Control": "max-age=31536000" },
    body: enc.blob
  });
  if (!res.ok) {
    const body = (await res.text().catch(() => "")).slice(0, 160);
    throw new Error("Завантаження фото: HTTP " + res.status + " " + body);
  }
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

async function uploadPhoto(id, source) {
  const img = await loadImage(source);
  const full = await encodeImage(img, 1600);
  const thumb = await encodeImage(img, 800);
  const base = id + "/" + Date.now().toString(36) + "-" + full.w + "x" + full.h;
  await putFile(base + "-thumb." + thumb.ext, thumb);
  return putFile(base + "-full." + full.ext, full);
}

// Bucket paths of the files behind an image URL (the full image and its thumb).
function urlPaths(url) {
  const m = String(url || "").match(new RegExp("/object/public/" + BUCKET + "/([^?#]+)"));
  if (!m) return [];
  const p = decodeURIComponent(m[1]);
  return /-full\.(webp|jpe?g)$/i.test(p) ? [p, p.replace(/-full\.(webp|jpe?g)$/i, "-thumb.$1")] : [p];
}

function storagePaths(id, url) {
  return [...new Set([id + "/full.webp", ...urlPaths(url)])];
}

// One-off maintenance (admin.html?tools): delete bucket files no item points to any more.
async function cleanupStorage() {
  if (busy) return;
  if (!(await requireAuth())) return;
  const log = $("#cleanLog");
  busy = true;
  try {
    const keep = new Set();
    rows.forEach((r) => urlPaths(r.img).forEach((p) => keep.add(p)));
    Object.values(settings).forEach((v) => urlPaths(v).forEach((p) => keep.add(p)));
    const top = await sb.storage.from(BUCKET).list("", { limit: 1000 });
    if (top.error) throw top.error;
    const folders = (top.data || []).filter((o) => !o.id).map((o) => o.name);
    if (!folders.length && keep.size) throw new Error("немає доступу до списку файлів — виконайте SQL №3 з ДОКУМЕНТАЦІЯ.md");
    const orphans = [];
    for (const f of folders) {
      log.textContent = "Перевіряю папку " + f + "…";
      const ls = await sb.storage.from(BUCKET).list(f, { limit: 1000 });
      if (ls.error) throw ls.error;
      (ls.data || []).filter((o) => o.id).forEach((o) => {
        const p = f + "/" + o.name;
        if (!keep.has(p)) orphans.push({ p, size: (o.metadata && o.metadata.size) || 0 });
      });
    }
    const mb = (orphans.reduce((s, o) => s + o.size, 0) / 1e6).toFixed(1);
    if (!orphans.length) { log.textContent = "Зайвих файлів немає."; return; }
    if (!confirm("Видалити " + orphans.length + " зайвих файлів (" + mb + " МБ)? Файли, на які посилаються роботи, не зачіпаються.")) { log.textContent = ""; return; }
    let removed = 0;
    for (let i = 0; i < orphans.length; i += 100) {
      const rm = await sb.storage.from(BUCKET).remove(orphans.slice(i, i + 100).map((o) => o.p));
      if (rm.error) throw rm.error;
      removed += (rm.data || []).length;
    }
    log.textContent = removed
      ? "Видалено файлів: " + removed + " з " + orphans.length + " (" + mb + " МБ)."
      : "Supabase нічого не видалив — немає дозволу на видалення. Виконайте SQL №3 з ДОКУМЕНТАЦІЯ.md.";
  } catch (e) {
    console.error(e);
    log.textContent = "Помилка: " + (e && e.message ? e.message : e);
  } finally {
    busy = false;
  }
}

async function removeFiles(paths) {
  if (!paths.length) return null;
  const rm = await sb.storage.from(BUCKET).remove(paths);
  if (rm.error) console.warn("storage remove:", rm.error.message || rm.error);
  return rm.error || null;
}

function blankRow(id, c) {
  return {
    id, cat: c, sort_order: 0, price: 0, year: "", img: "", hidden: false,
    title: "", title_en: "", hall: "", hall_en: "", size: "", size_en: "",
    tech: "", tech_en: "", description: "", description_en: ""
  };
}

// ---------- Items ----------

async function saveItem() {
  if (busy) return;
  if (!(await requireAuth())) return;
  const id = editingId || newId();
  const icat = $("#edCat").value;
  const isProj = photoOnly(icat);
  const file = $("#edImg").files[0];
  const titleUa = $("#edTua").value.trim();
  const oldImg = editingId ? ($("#edPrev").dataset.current || "") : "";
  if (!titleUa && !isProj) { toast("Вкажіть назву"); return; }
  if (isProj && !file && !oldImg) { toast("Оберіть фото"); return; }
  const btn = $("#edSave");
  btn.disabled = true; busy = true;
  try {
    let img = oldImg;
    if (file) { toast("Стискаю і завантажую фото…", true); img = await uploadPhoto(id, file); }
    const prev = rows.find(x => x.id === id);
    const sort = (prev && (prev.cat || "paintings") === icat) ? (prev.sort_order || 0) : nextOrder(icat);
    const price = Number($("#edPrice").value);
    const hallUa = icat === "paintings" ? $("#edHall").value.trim() : "";
    const hallRow = halls.find(h => h.name === hallUa);
    const techUa = $("#edTech").value.trim();
    const sizeUa = $("#edSize").value.trim();
    const descUa = $("#edDesc").value.trim();
    const titleEn = $("#edTen").value.trim() || titleUa;
    const techEn = $("#edTechEn").value.trim(), descEn = $("#edDescEn").value.trim();
    const row = Object.assign(blankRow(id, icat), {
      sort_order: sort, price: isNaN(price) ? 0 : price,
      year: $("#edYear").value.trim(), img, hidden: $("#edHidden").checked,
      title: titleUa, title_en: titleEn,
      hall: hallUa, hall_en: hallUa ? ((hallRow && hallRow.name_en) || HALLS[hallUa] || hallUa) : "",
      size: sizeUa, size_en: sizeUa, tech: techUa, tech_en: techEn || techUa,
      description: descUa, description_en: descEn || descUa
    });
    const { error } = await sb.from("items").upsert(row, { onConflict: "id" });
    if (error) {
      const alive = await sessionAlive();
      throw new Error("Збереження в базу: " + error.message + (alive ? "" : " — ви не увійшли"));
    }
    if (file && oldImg && oldImg !== img) await removeFiles(storagePaths(id, oldImg));
    toast(prev && (prev.cat || "paintings") !== icat ? "Збережено й перенесено в інший розділ" : "Збережено");
    closeEditor();
    await load();
  } catch (e) {
    console.error(e);
    toast("Помилка: " + (e && e.message ? e.message : e));
  }
  btn.disabled = false; busy = false;
}

async function deleteItem(d) {
  const err = await removeFiles(storagePaths(d.id, d.img));
  const { error } = await sb.from("items").delete().eq("id", d.id);
  if (error) throw error;
  toast("Видалено" + (err ? " (фото не стерлося: " + (err.message || "помилка") + ")" : ""));
}

async function addPhotos(files, c) {
  if (busy || !files.length) return;
  if (!(await requireAuth())) return;
  busy = true;
  $("#addBtn").disabled = true;
  let done = 0, failed = 0;
  let order = nextOrder(c);
  for (const f of files) {
    toast("Завантажую фото " + (done + failed + 1) + " з " + files.length + "…", true);
    const id = newId();
    try {
      const img = await uploadPhoto(id, f);
      const { error } = await sb.from("items").upsert(Object.assign(blankRow(id, c), { img, sort_order: order++ }), { onConflict: "id" });
      if (error) { await removeFiles(storagePaths(id, img)); throw error; }
      done++;
    } catch (e) {
      console.error(e);
      failed++;
    }
  }
  busy = false;
  $("#addBtn").disabled = false;
  toast("Додано фото: " + done + (failed ? " · не вдалося: " + failed : ""));
  await load();
}

// «Продано» / «Резерв» for paintings live in settings.status = {"<item id>": "sold" | "reserved"} (no table change needed).
const STATUSES = [["", "В наявності"], ["reserved", "Резерв"], ["sold", "Продано"]];
function statusMap() {
  try { const m = JSON.parse(settings.status || "{}"); return m && typeof m === "object" ? m : {}; } catch (e) { return {}; }
}
// The site shows «Нове» for 14 days after a painting is added (counted from 2026-10-04, when the badge appeared).
function isNewWork(d) {
  const t = Date.parse(d.created_at || "");
  return t >= Date.parse("2026-10-04T17:00:00Z") && Date.now() - t < 14 * 864e5 && !statusMap()[d.id];
}

function bindOps(el) {
  el.querySelectorAll("[data-st]").forEach(b => b.addEventListener("click", async () => {
    const m = statusMap(), v = b.dataset.st, id = b.dataset.id;
    if ((m[id] || "") === v) return;
    if (v) m[id] = v; else delete m[id];
    for (const k of Object.keys(m)) if (!rows.some(r => r.id === k)) delete m[k]; // forget deleted works
    await saveSettings({ status: JSON.stringify(m) });
  }));
  el.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", async () => {
    const act = b.dataset.act, id = b.dataset.id;
    const d = rows.find(x => x.id === id);
    if (!d) return;
    if (act === "edit") { openEditor(id); return; }
    if (!(await requireAuth())) return;
    if (act === "del") {
      if (!confirm("Видалити «" + (d.title || "фото") + "» безповоротно?")) return;
      try { await deleteItem(d); } catch (e) { toast("Помилка: " + e.message); return; }
      await load();
      return;
    }
    if (act === "hide") {
      const { error } = await sb.from("items").update({ hidden: !d.hidden }).eq("id", id);
      if (error) { toast(error.message); return; }
      toast(d.hidden ? "Показано" : "Сховано");
      await load();
    } else {
      const list = ofCat(cat);
      const i = list.findIndex(x => x.id === id);
      const j = act === "up" ? i - 1 : i + 1;
      if (j < 0 || j >= list.length) return;
      const a = list[i], b2 = list[j];
      let oa = a.sort_order || 0, ob = b2.sort_order || 0;
      if (oa === ob) ob = oa + (act === "up" ? -1 : 1);
      await sb.from("items").update({ sort_order: ob }).eq("id", a.id);
      await sb.from("items").update({ sort_order: oa }).eq("id", b2.id);
      toast("Порядок змінено");
      await load();
    }
  }));
}

// Re-rendering the tab (token refresh, reload after saving an item) must not wipe text being typed.
// ---------- «Інструкція»: ІНСТРУКЦІЯ-ДЛЯ-КАТЕРИНИ.md (one text for the repo and the admin) as an accordion ----------

let helpHtml = "";

function mdInline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(«])\*([^*\s][^*]*?)\*(?=[\s.,;:!?)»]|$)/g, "$1<i>$2</i>")
    .replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)»])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

// Just what the guide uses: paragraphs (line breaks kept), - / 1. lists with indented continuation lines, ---.
function mdBlocks(md) {
  const out = [];
  let list = null, para = [];
  const flushPara = () => { if (para.length) { out.push("<p>" + para.map(mdInline).join("<br>") + "</p>"); para = []; } };
  const flushList = () => {
    if (list) out.push(`<${list.tag}>` + list.items.map((i) => "<li>" + i.map(mdInline).join("<br>") + "</li>").join("") + `</${list.tag}>`);
    list = null;
  };
  md.split("\n").forEach((line) => {
    const t = line.trim();
    if (!t || t === "---") { flushPara(); flushList(); return; }
    const m = t.match(/^(\d+)\.\s+(.*)/) || t.match(/^[-*]\s+(.*)/);
    if (m) {
      const tag = /^\d/.test(t) ? "ol" : "ul";
      flushPara();
      if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
      list.items.push([tag === "ol" ? m[2] : m[1]]);
      return;
    }
    if (list && /^\s{2,}/.test(line)) { list.items[list.items.length - 1].push(t); return; }
    flushList();
    para.push(t);
  });
  flushPara(); flushList();
  return out.join("");
}

function helpFromMd(md) {
  const parts = md.replace(/\r/g, "").split(/^## /m);
  const intro = parts.shift().replace(/^# .*\n/, "");
  return `<div class="card help-intro" style="margin-bottom:10px;">${mdBlocks(intro)}</div>` + parts.map((p) => {
    const nl = p.indexOf("\n");
    return `<details class="help"><summary>${mdInline(p.slice(0, nl).trim())}</summary><div class="help-body">${mdBlocks(p.slice(nl + 1))}</div></details>`;
  }).join("");
}

function fillHelp(el) {
  if (el.querySelector("#helpList")) return; // already shown: keep the open sections as they are

// The list of texts is read from the live index.html (every element with data-en), so it never goes stale.
// Texts are grouped by where they stand on the page and labelled by what they are (menu item, title, small
// label, text), so a paragraph doesn't end up in a menu item or a small label.
const TEXT_PLACES = {
  top: "Головний екран", halls: "Зали", paper: "Листівки", boxes: "Брендована продукція", projects: "Реалізовані проєкти",
  about: "Про мене", interior: "В інтер'єрі", order: "На замовлення", workshops: "Майстер-класи",
  collab: "Мерч і колаборації", contact: "Контакти"
};
let textItems = [];

// Same rule as index.html → textKey().
function textKey(n, ua) {
  return n.getAttribute("data-key") || ((n.closest(".dc-nav, .dc-mmenu") ? "menu:" : "") + ua);
}

function textPlace(n) {
  if (n.closest(".dc-nav, .dc-mmenu")) return "Меню";
  if (n.closest(".dc-ribbon")) return "Стрічка над меню";
  if (n.closest("header")) return "Шапка";
  const sec = n.closest("section[id]");
  if (sec) return TEXT_PLACES[sec.id] || sec.id;
  return "Вікна картини й кошика";
}

function textRole(n) {
  const tag = n.tagName.toLowerCase(), st = n.getAttribute("style") || "";
  if (n.closest(".dc-nav, .dc-mmenu")) return "пункт меню";
  if (tag === "h1" || tag === "h2") return "заголовок";
  if (/uppercase/.test(st)) return "дрібний підпис великими літерами";
  if (tag === "p") return "текст";
  if (tag === "a" || tag === "button") return "кнопка / посилання";
  return "підзаголовок";
}

async function loadTexts() {
  const box = $("#txtList");
  let html;
  try { html = await (await fetch("index.html", { cache: "no-store" })).text(); } catch (e) { box.innerHTML = '<p class="muted">Не вдалося завантажити тексти.</p>'; return; }
  if (!$("#txtList")) return;
  const doc = new DOMParser().parseFromString(html, "text/html");
  const byKey = new Map();
  doc.querySelectorAll("[data-en]").forEach((n) => {
    const ua = n.textContent;
    if (!ua.trim()) return;
    const key = textKey(n, ua);
    const seen = byKey.get(key);
    if (seen) { seen.count++; return; }
    byKey.set(key, { key, ua, en: n.getAttribute("data-en") || "", place: textPlace(n), role: textRole(n), count: 1 });
  });
  // grouped by place, places in page order (the phone menu comes later in the markup than the header)
  const all = [...byKey.values()];
  const places = [...new Set(all.map(t => t.place))];
  const items = textItems = places.flatMap(pl => all.filter(t => t.place === pl));
  const edits = textEdits();
  let lastPlace = "";
  box.innerHTML = items.map((it, i) => {
    const e = edits[it.key] || {};
    const tabNote = { "Майстер-класи": "«Майстер-класи»", "Реалізовані проєкти": "«Реалізовані проєкти»" }[it.place];
    const head = it.place !== lastPlace ? `<h3 class="txt-place" style="font-family:Georgia,serif; font-weight:400; font-size:17px; margin:22px 0 2px;">${esc(it.place)}</h3>` +
      (tabNote ? `<p class="muted" style="margin:0 0 6px;">Основний текст цього розділу змінюється у вкладці ${tabNote} (зверху, «Текст…»).</p>` : "") : "";
    lastPlace = it.place;
    const where = it.role + (it.count > 1 ? (it.role === "пункт меню" ? " · у меню на комп'ютері й на телефоні" : " · стоїть у " + it.count + " місцях, зміниться всюди") : "");
    return `${head}<div class="txt" data-i="${i}" style="border-top:1px solid rgba(27,26,22,.12); padding:12px 0 14px;">
      <div class="muted" style="font-size:12.5px; margin-bottom:6px;">${esc(where)}</div>
      <div class="grid2">
        <label>Українською<textarea rows="${it.ua.length > 90 ? 4 : 2}" data-ua placeholder="${esc(it.ua)}">${esc(e.ua || "")}</textarea></label>
        <label>English<textarea rows="${it.ua.length > 90 ? 4 : 2}" data-en placeholder="${esc(it.en)}">${esc(e.en || "")}</textarea></label>
      </div>
      <button class="btn btn-line" data-save="${i}">Зберегти</button>
    </div>`;
  }).join("");
  box.querySelectorAll("[data-save]").forEach((b) => b.addEventListener("click", () => {
    const row = b.closest(".txt"), it = items[Number(b.dataset.save)];
    const ua = row.querySelector("[data-ua]").value.trim(), en = row.querySelector("[data-en]").value.trim();
    // a whole paragraph pasted into a menu item or a small label breaks the page — ask first
    const long = (v) => v.length > Math.max(60, it.ua.length * 3);
    if (it.ua.length <= 40 && (long(ua) || long(en)) && !confirm("Це поле — «" + it.ua + "» (" + it.place + ", " + it.role + "). Новий текст значно довший — точно сюди?\n\nДовгий текст пишіть у поле «текст» потрібного розділу.")) return;
    saveText(it.key, ua, en);
  }));
  const find = $("#txtFind");
  const filter = () => {
    const q = find.value.trim().toLowerCase();
    box.querySelectorAll(".txt").forEach((row) => {
      const it = items[Number(row.dataset.i)];
      const hay = (it.ua + " " + it.en + " " + it.place + " " + row.querySelector("[data-ua]").value + " " + row.querySelector("[data-en]").value).toLowerCase();
      row.style.display = !q || hay.includes(q) ? "" : "none";
    });
    box.querySelectorAll(".txt-place").forEach((h) => {
      let n = h.nextElementSibling, any = false;
      while (n && n.classList.contains("txt")) { if (n.style.display !== "none") any = true; n = n.nextElementSibling; }
      h.style.display = any ? "" : "none";
    });
  };
  find.addEventListener("input", filter);
  filter();
}

async function saveText(key, newUa, newEn) {
  if (!(await requireAuth())) return;
  const edits = textEdits();
  if (newUa || newEn) edits[key] = { ua: newUa, en: newEn }; else delete edits[key];
  // drop edits of texts that are no longer on the page (they never show anywhere)
  if (textItems.length) { const live = new Set(textItems.map(t => t.key)); Object.keys(edits).forEach((k) => { if (!live.has(k)) delete edits[k]; }); }
  const value = JSON.stringify(edits);
  const { error } = await sb.from("settings").upsert([{ key: "texts", value }], { onConflict: "key" });
  if (error) { toast("Помилка: " + error.message); return; }
  settings.texts = value;
  toast(newUa || newEn ? "Текст збережено" : "Повернуто як було");
}

async function uploadPagePhoto(key, file) {
  if (busy || !file) return;
  if (!(await requireAuth())) return;
  busy = true;
  const old = settings[key];
  try {
    toast("Стискаю і завантажую фото…", true);
    const url = await uploadPhoto("page", file);
    const { error } = await sb.from("settings").upsert([{ key, value: url }], { onConflict: "key" });
    if (error) { await removeFiles(urlPaths(url)); throw error; }
    if (old) await removeFiles(urlPaths(old));
    toast("Фото замінено");
  } catch (e) {
    toast("Помилка: " + (e && e.message ? e.message : e));
  }
  busy = false;
  await load();
}

async function resetPagePhoto(key) {
  if (!confirm("Повернути фото, яке було спочатку?")) return;
  if (!(await requireAuth())) return;
  const old = settings[key];
  const { error } = await sb.from("settings").upsert([{ key, value: "" }], { onConflict: "key" });
  if (error) { toast("Помилка: " + error.message); return; }
  if (old) await removeFiles(urlPaths(old));
  toast("Повернуто");
  await load();
}

async function changePassword() {

// ---------- One-off: English translations prepared in en-import.json (items / halls / settings / page texts) ----------
// The card shows only while something in the file differs from the database, so it disappears once applied.

let enImport = null;
const diffOf = (cur, want) => Object.fromEntries(Object.entries(want).filter(([k, v]) => String(cur[k] || "") !== v));

function enPending(data) {
  let n = 0;
  Object.entries(data.items || {}).forEach(([id, f]) => { const r = rows.find((x) => x.id === id); if (r && Object.keys(diffOf(r, f)).length) n++; });
  Object.entries(data.halls || {}).forEach(([name, f]) => { const h = halls.find((x) => x.name === name); if (h && Object.keys(diffOf(h, f)).length) n++; });
  Object.entries(data.settings || {}).forEach(([k, v]) => { if ((settings[k] || "") !== v) n++; });
  let texts = {};
  try { texts = JSON.parse(settings.texts || "{}") || {}; } catch (e) {}
  Object.entries(data.texts || {}).forEach(([k, en]) => { if (((texts[k] || {}).en || "") !== en) n++; });
  return n;
}

async function fillEnImport() {
  const box = $("#enImport");
  if (!box) return;
  if (!enImport) {
    try { const r = await fetch("en-import.json?v=" + Date.now()); enImport = r.ok ? await r.json() : {}; } catch (e) { enImport = {}; }
  }
  const n = settingsOk ? enPending(enImport) : 0;
  if (!n || !$("#enImport")) { box.innerHTML = ""; return; }
  box.innerHTML = `<div class="card">
      <h2>Англійська версія сайту</h2>
      <p class="muted" style="margin-bottom:14px;">Готові переклади англійською: назви, техніка й описи робіт, описи зал, тексти «Реалізованих проєктів», «Майстер-класів» і змінені тексти сторінки (${n} шт.). Один клік — і англійська версія сайту стане повністю англійською. Далі все редагується як звичайно.</p>
      <button class="btn btn-dark" id="enImportBtn">Додати англійські переклади</button>
    </div>`;
  $("#enImportBtn").addEventListener("click", applyEnImport);
}

async function applyEnImport() {
  if (busy || !enImport) return;
  if (!(await requireAuth())) return;
  busy = true;
  const btn = $("#enImportBtn");
  if (btn) btn.disabled = true;
  try {
    for (const [id, f] of Object.entries(enImport.items || {})) {
      const r = rows.find((x) => x.id === id), upd = r ? diffOf(r, f) : {};
      if (!Object.keys(upd).length) continue;
      const { error } = await sb.from("items").update(upd).eq("id", id);
      if (error) throw error;
    }
    for (const [name, f] of Object.entries(enImport.halls || {})) {
      const h = halls.find((x) => x.name === name), upd = h ? diffOf(h, f) : {};
      if (!Object.keys(upd).length) continue;
      const { error } = await sb.from("halls").update(upd).eq("id", h.id);
      if (error) throw error;
      if (upd.name_en) await sb.from("items").update({ hall_en: upd.name_en }).eq("hall", name);
    }
    const s = {};
    Object.entries(enImport.settings || {}).forEach(([k, v]) => { if ((settings[k] || "") !== v) s[k] = v; });
    let texts = {};
    try { texts = JSON.parse(settings.texts || "{}") || {}; } catch (e) {}
    let changed = false;
    Object.entries(enImport.texts || {}).forEach(([k, en]) => {
      const cur = texts[k] || {};
      if ((cur.en || "") !== en) { texts[k] = { ua: cur.ua || "", en }; changed = true; }
    });
    if (changed) s.texts = JSON.stringify(texts);
    busy = false;
    if (Object.keys(s).length) await saveSettings(s);
    else { toast("Збережено"); await load(); }
  } catch (e) {
    busy = false;
    if (btn) btn.disabled = false;
    toast("Помилка: " + (e.message || e));
  }
}

async function saveSettings(obj) {
  if (!(await requireAuth())) return;
  const payload = Object.keys(obj).map((k) => ({ key: k, value: obj[k] }));
  const { error } = await sb.from("settings").upsert(payload, { onConflict: "key" });
  if (error) { toast("Помилка: " + error.message); return; }
  $("#extra").dataset.saved = "1";
  toast("Збережено");
  await load();
}

async function optimizeLegacy() {
  if (busy) return;
  if (!(await requireAuth())) return;
  const legacy = rows.filter(r => r.img && !isOptimized(r.img));
  if (!legacy.length) return;
  busy = true;
  $("#optBtn").disabled = true;
  const log = $("#optLog");
  let done = 0, failed = 0;
  for (const r of legacy) {
    log.textContent = "Обробляю " + (done + failed + 1) + " з " + legacy.length + ": " + (r.title || "фото") + "…";
    try {
      const res = await fetch(r.img, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const img = await uploadPhoto(r.id, await res.blob());
      const { error } = await sb.from("items").update({ img }).eq("id", r.id);
      if (error) { await removeFiles(storagePaths(r.id, img)); throw error; }
      await removeFiles(storagePaths(r.id, r.img));
      done++;
    } catch (e) {
      console.error(r.id, e);
      failed++;
    }
  }
  busy = false;
  log.textContent = "Готово: " + done + (failed ? " · не вдалося: " + failed + " (спробуйте ще раз)" : "");
  toast("Фото оптимізовано: " + done);
  await load();
}

      <div>
        <div class="t">${esc(h.name)}</div>
        <div class="s">${cnt} робіт${h.name_en ? " · " + esc(h.name_en) : ""}</div>
      </div>
      <div class="ops">
        <button data-act="up" data-id="${esc(h.id)}">↑</button>
        <button data-act="down" data-id="${esc(h.id)}">↓</button>
        <button data-act="edit" data-id="${esc(h.id)}">Редагувати</button>

async function deleteHall(h) {
  await sb.from("items").update({ hall: "", hall_en: "" }).eq("hall", h.name);
  const { error } = await sb.from("halls").delete().eq("id", h.id);
  if (error) throw error;
  toast("Залу видалено");
}

function bindHallOps(el) {
  el.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", async () => {
    const act = b.dataset.act, id = b.dataset.id;
    const h = halls.find(x => x.id === id);
    if (!h) return;
    if (act === "edit") { openHallEditor(id); return; }
    if (!(await requireAuth())) return;
    if (act === "del") {
      if (!confirm("Видалити залу? Роботи цієї зали стануть «Без зали».")) return;
      try { await deleteHall(h); } catch (e) { toast("Помилка: " + e.message); return; }
      await load();
    } else {
      const list = halls.slice().sort(byOrder);
      const i = list.findIndex(x => x.id === id);
      const j = act === "up" ? i - 1 : i + 1;
      if (j < 0 || j >= list.length) return;
      const a = list[i], b2 = list[j];
      let oa = a.sort_order || 0, ob = b2.sort_order || 0;
      if (oa === ob) ob = oa + (act === "up" ? -1 : 1);
      await sb.from("halls").update({ sort_order: ob }).eq("id", a.id);
      await sb.from("halls").update({ sort_order: oa }).eq("id", b2.id);
      toast("Порядок змінено");
      await load();
    }
  }));
}

function openHallEditor(id) {
  editingHallId = id || null;
  $("#heTitle").textContent = id ? "Редагувати залу" : "Нова зала";
  $("#heDelete").style.display = id ? "" : "none";
  $("#heNum").value = $("#heName").value = $("#heNameEn").value = $("#heNote").value = $("#heNoteEn").value = "";
  if (id) {
    const h = halls.find(x => x.id === id);
    if (h) {
      $("#heNum").value = h.num || "";
      $("#heName").value = h.name || "";
      $("#heNameEn").value = h.name_en || "";
      $("#heNote").value = h.note || "";
      $("#heNoteEn").value = h.note_en || "";
    }
  }
  $("#hallEditor").style.display = "flex";
}
function closeHallEditor() { $("#hallEditor").style.display = "none"; editingHallId = null; }

async function saveHall() {
  if (!(await requireAuth())) return;
  const name = $("#heName").value.trim();
  if (!name) { toast("Вкажіть назву зали"); return; }
  if (halls.some(h => h.name === name && h.id !== editingHallId)) { toast("Зала з такою назвою вже є"); return; }
  const prev = editingHallId ? halls.find(h => h.id === editingHallId) : null;
  const id = editingHallId || newId();
  const row = {
    id, num: $("#heNum").value.trim(), name, name_en: $("#heNameEn").value.trim(),
    note: $("#heNote").value.trim(), note_en: $("#heNoteEn").value.trim(),
    sort_order: prev ? (prev.sort_order || 0) : Number(window._heOrder || 0)
  };
  const { error } = await sb.from("halls").upsert(row, { onConflict: "id" });
  if (error) { toast("Помилка: " + error.message); return; }
  // Works are linked to a hall by its name, so carry a rename (and the English name) over to them.
  if (prev) {
    const up = await sb.from("items").update({ hall: name, hall_en: row.name_en || name }).eq("hall", prev.name);
    if (up.error) { toast("Залу збережено, але роботи не оновились: " + up.error.message); closeHallEditor(); await load(); return; }
  }
  toast("Збережено");
  closeHallEditor();
  await load();
}

$("#heClose").addEventListener("click", closeHallEditor);
$("#heCancel").addEventListener("click", closeHallEditor);
$("#heSave").addEventListener("click", saveHall);
$("#heDelete").addEventListener("click", async () => {
  if (!(await requireAuth())) return;
  if (!editingHallId || !confirm("Видалити залу? Роботи стануть «Без зали».")) return;
  const h = halls.find(x => x.id === editingHallId);
  if (!h) return;
  try { await deleteHall(h); } catch (e) { toast("Помилка: " + e.message); return; }
  closeHallEditor();
  await load();
});

function fillHallSelect(current) {

    `<option value="${esc(h.name)}">${h.num ? esc(h.num) + " · " : ""}${esc(h.name)}</option>`
  );
  // Keep an unknown (e.g. renamed outside the admin) hall selectable so saving doesn't silently drop it.
  if (current && !halls.some(h => h.name === current)) opts.push(`<option value="${esc(current)}">${esc(current)} (немає у «Залах»)</option>`);
  sel.innerHTML = '<option value="">Без зали (на сайті — «Інші роботи»)</option>' + opts.join("");
  sel.value = current || "";
}

// ---------- Auth & wiring ----------

$("#loginBtn").addEventListener("click", login);
$("#email").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
$("#pass").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
async function login() {
  const email = $("#email").value.trim(), pass = $("#pass").value;
  $("#loginErr").textContent = "";
  if (!email || !pass) { $("#loginErr").textContent = "Введіть пошту і пароль."; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) $("#loginErr").textContent = "Неправильна пошта або пароль.";
}
$("#logoutBtn").addEventListener("click", () => sb.auth.signOut());
$("#addBtn").addEventListener("click", () => {
  if (cat === "halls") {
    window._heOrder = halls.reduce((m, h) => Math.max(m, h.sort_order || 0), 0) + 1;
    openHallEditor(null);
  } else if (photoOnly(cat)) {
    $("#multiImg").value = "";
    $("#multiImg").click();
  } else {
    openEditor(null);
  }
});
$("#multiImg").addEventListener("change", () => addPhotos([...$("#multiImg").files], cat));
$("#edClose").addEventListener("click", closeEditor);
$("#edCancel").addEventListener("click", closeEditor);
$("#edSave").addEventListener("click", saveItem);
$("#edDelete").addEventListener("click", async () => {
  if (!editingId || !confirm("Видалити безповоротно?")) return;
  if (!(await requireAuth())) return;
  const d = rows.find(x => x.id === editingId);
  if (!d) return;
  try {
    await deleteItem(d);
    closeEditor();
    await load();
  } catch (e) { toast("Помилка: " + e.message); }
});
$$("#tabs .tab").forEach(t => t.addEventListener("click", () => {
  $$("#tabs .tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  cat = t.dataset.cat;
  $("#addBtn").textContent = cat === "halls" ? "Додати залу" : photoOnly(cat) ? "Додати фото" : "Додати";
  render();
}));

function setUser(user) {
  $("#login").style.display = user ? "none" : "";
  $("#app").style.display = user ? "" : "none";
  $("#whoami").textContent = user ? "Увійшла: " + (user.email || "") : "";
  if (user) load();
}

async function sessionAlive() {
  const { data } = await sb.auth.getUser().catch(() => ({ data: { user: null } }));
  return !!(data && data.user);
}

async function requireAuth() {
  const alive = await sessionAlive();
  if (!alive) { setUser(null); toast("Сесію завершено — увійдіть заново."); return false; }
  return true;
}

function init() {
  if (!CONFIG_OK) {
    document.body.innerHTML = '<div class="wrap"><div class="card"><h1>Supabase не налаштовано</h1><p class="muted" style="margin-top:10px;">Заповніть <b>supabase-config.js</b> (url та anonKey з налаштувань проєкту).</p></div></div>';
    return;
  }
  sb = window.supabase.createClient(CFG.url, CFG.anonKey);
  sb.auth.getUser().then(({ data }) => setUser(data.user || null)).catch(() => setUser(null));
  sb.auth.onAuthStateChange((_e, session) => setUser(session ? session.user : null));
}
init();
</script>
</body>
</html>
