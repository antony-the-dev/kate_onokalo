<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Адмін · Катерина Онокало</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<script src="./supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Commissioner", system-ui, sans-serif; font-weight: 300; background: #E9E4DC; color: #1B1A16; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 80px; }
  .card { background: #F4F0E8; border: 1px solid rgba(27,26,22,.12); border-radius: 14px; padding: 22px; }
  h1 { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 26px; letter-spacing: .02em; }
  h2 { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 19px; margin-bottom: 6px; }
  .muted { color: #857F74; font-size: 13.5px; line-height: 1.5; }
  input, select, textarea { width: 100%; background: #E9E4DC; border: 1px solid rgba(27,26,22,.25); border-radius: 10px; padding: 12px 14px; font: inherit; font-size: 15px; color: #1B1A16; margin-top: 6px; }
  textarea { line-height: 1.5; resize: vertical; }
  label { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #5A554C; margin-bottom: 14px; }
  button { font: inherit; font-weight: 500; cursor: pointer; }
  .btn { border: none; border-radius: 10px; padding: 13px 22px; font-size: 13px; letter-spacing: .08em; }
  .btn-dark { background: #0A1C3B; color: #E9E4DC; }
  .btn-line { background: none; border: 1px solid rgba(27,26,22,.3); color: #1B1A16; }
  .btn-danger { background: #B4501C; color: #FFF; }
  .btn:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 12px; align-items: center; }
  .tabs { display: flex; gap: 8px; margin: 22px 0 16px; flex-wrap: wrap; }
  .tab { border: 1px solid rgba(27,26,22,.3); background: none; border-radius: 999px; padding: 10px 18px; font-size: 13px; letter-spacing: .05em; }
  .tab.active { background: #0A1C3B; color: #E9E4DC; border-color: #0A1C3B; }
  .item { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; background: #F4F0E8; border: 1px solid rgba(27,26,22,.12); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .item img, .thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: #DCD5C9; }
  .item .thumb { display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-size: 20px; color: #B4501C; }
  .item .t { font-size: 15.5px; }
  .item .s { font-size: 12.5px; color: #857F74; margin-top: 3px; }
  .item .price { font-size: 14.5px; font-weight: 500; }
  .item .ops { display: flex; gap: 6px; flex-wrap: wrap; }
  .ops button { border: 1px solid rgba(27,26,22,.25); background: none; border-radius: 8px; padding: 7px 10px; font-size: 12.5px; }
  .ops button:hover { border-color: #0A1C3B; }
  .hidden-tag { color: #B4501C; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-left: 8px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0A1C3B; color: #E9E4DC; padding: 12px 22px; border-radius: 999px; font-size: 13.5px; display: none; z-index: 50; max-width: 92vw; text-align: center; }
  .note { background: #F6E7DC; border: 1px solid rgba(180,80,28,.25); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; line-height: 1.5; color: #5A3A26; }
  .extra { margin-bottom: 16px; }
  .extra .card + .card { margin-top: 12px; }
  #editor, #hallEditor { position: fixed; inset: 0; background: rgba(10,28,59,.6); display: none; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; z-index: 40; }
  #editor .card, #hallEditor .card { max-width: 620px; width: 100%; max-height: 92vh; overflow-y: auto; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } .item { grid-template-columns: 52px 1fr; } .item img, .item .thumb { width: 52px; height: 52px; } .item .ops { grid-column: 1 / -1; } }
</style>

      <label>Мітка (I, II, V…)<input id="heNum" type="text" placeholder="V"></label>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const CFG = window.SUPABASE_CONFIG || {};
const CONFIG_OK = CFG.url && CFG.anonKey;
const BUCKET = "items";
const TOOLS = /[?&]tools\b/.test(location.search);
const NEW_TITLE = { paintings: "Нова картина", postcards: "Нова листівка", boxes: "Новий бокс", projects: "Нове фото" };

// English names of the original built-in halls (used when a hall has no English name in the «Зали» tab).
const HALLS = {
  "Зала I · Абстракція": "Hall I · Abstraction",
  "Зала II · Квіти й поля": "Hall II · Flowers & Fields",
  "Зала III · Україна": "Hall III · Ukraine",
  "Зала IV · Поп-образи": "Hall IV · Pop & Characters"
};

let sb = null;
let cat = "paintings";
let editingId = null;
let editingHallId = null;
let rows = [];
let halls = [];
let settings = {};
let settingsOk = true;
let busy = false;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function toast(msg, sticky) {
  const t = $("#toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(toast._t);
  if (!sticky) toast._t = setTimeout(() => t.style.display = "none", 3200);
}

function newId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0, v = c === "x" ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}

function byOrder(a, b) { return (a.sort_order || 0) - (b.sort_order || 0); }
function ofCat(c) { return rows.filter(x => (x.cat || "paintings") === c).sort(byOrder); }
function nextOrder(c) { return ofCat(c).reduce((m, d) => Math.max(m, d.sort_order || 0), 0) + 1; }

// ---------- Photos ----------
// Every upload is stored as "<id>/<stamp>-<w>x<h>-full.<ext>" plus a "-thumb" copy (800px) for grids.
// A fresh name per upload means no overwrite conflicts and no stale caches; the site reads the size from the name.

function thumbOf(url) { return String(url || "").replace(/-full\.(webp|jpe?g)(?=$|\?)/i, "-thumb.$1"); }
function isOptimized(url) { return /-\d+x\d+-full\.(webp|jpe?g)(?=$|\?)/i.test(String(url || "")); }

function loadImage(blob) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("браузер не зміг відкрити це фото (спробуйте JPG або PNG)")); };
    img.src = url;
  });
}

function canvasBlob(canvas, type, quality) {
  return new Promise((resolve) => canvas.toBlob(resolve, type, quality));
}

// Safari cannot encode WebP (toBlob silently returns PNG), so fall back to JPEG there.
async function encodeImage(img, max) {
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const scale = Math.min(1, max / Math.max(iw, ih));
  const w = Math.max(1, Math.round(iw * scale)), h = Math.max(1, Math.round(ih * scale));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, w, h);
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0, w, h);
  let blob = await canvasBlob(c, "image/webp", 0.82);
  if (blob && blob.type === "image/webp") return { blob, w, h, ext: "webp", type: "image/webp" };
  blob = await canvasBlob(c, "image/jpeg", 0.85);
  if (!blob) throw new Error("не вдалося стиснути фото");
  return { blob, w, h, ext: "jpg", type: "image/jpeg" };
}

async function putFile(path, enc) {
  const signed = await sb.storage.from(BUCKET).createSignedUploadUrl(path);
  if (signed.error) throw new Error("Створення посилання для фото: " + (signed.error.message || signed.error));
  // The SDK sends multipart with a cacheControl field — the only way the long cache header is stored.
  const up = await sb.storage.from(BUCKET).uploadToSignedUrl(path, signed.data.token, enc.blob, { cacheControl: "31536000", contentType: enc.type });
  if (!up.error) return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  console.warn("uploadToSignedUrl failed, retrying with a plain PUT:", up.error.message || up.error);
  const res = await fetch(signed.data.signedUrl, {
    method: "PUT",
    headers: { "Content-Type": enc.type },
    body: enc.blob
  });
  if (!res.ok) {
    const body = (await res.text().catch(() => "")).slice(0, 160);
    throw new Error("Завантаження фото: HTTP " + res.status + " " + body);
  }
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

async function uploadPhoto(id, source) {
  const img = await loadImage(source);
  const full = await encodeImage(img, 1600);
  const thumb = await encodeImage(img, 800);
  const base = id + "/" + Date.now().toString(36) + "-" + full.w + "x" + full.h;
  await putFile(base + "-thumb." + thumb.ext, thumb);
  return putFile(base + "-full." + full.ext, full);
}

// Bucket paths of the files behind an image URL (the full image and its thumb).
function urlPaths(url) {
  const m = String(url || "").match(new RegExp("/object/public/" + BUCKET + "/([^?#]+)"));
  if (!m) return [];
  const p = decodeURIComponent(m[1]);
  return /-full\.(webp|jpe?g)$/i.test(p) ? [p, p.replace(/-full\.(webp|jpe?g)$/i, "-thumb.$1")] : [p];
}

function storagePaths(id, url) {
  return [...new Set([id + "/full.webp", ...urlPaths(url)])];
}

// One-off maintenance (admin.html?tools): delete bucket files no item points to any more.
async function cleanupStorage() {
  if (busy) return;
  if (!(await requireAuth())) return;
  const log = $("#cleanLog");
  busy = true;
  try {
    const keep = new Set();
    rows.forEach((r) => urlPaths(r.img).forEach((p) => keep.add(p)));
    const top = await sb.storage.from(BUCKET).list("", { limit: 1000 });
    if (top.error) throw top.error;
    const folders = (top.data || []).filter((o) => !o.id).map((o) => o.name);
    if (!folders.length && keep.size) throw new Error("немає доступу до списку файлів — виконайте SQL №3 з ДОКУМЕНТАЦІЯ.md");
    const orphans = [];
    for (const f of folders) {
      log.textContent = "Перевіряю папку " + f + "…";
      const ls = await sb.storage.from(BUCKET).list(f, { limit: 1000 });
      if (ls.error) throw ls.error;
      (ls.data || []).filter((o) => o.id).forEach((o) => {
        const p = f + "/" + o.name;
        if (!keep.has(p)) orphans.push({ p, size: (o.metadata && o.metadata.size) || 0 });
      });
    }
    const mb = (orphans.reduce((s, o) => s + o.size, 0) / 1e6).toFixed(1);
    if (!orphans.length) { log.textContent = "Зайвих файлів немає."; return; }
    if (!confirm("Видалити " + orphans.length + " зайвих файлів (" + mb + " МБ)? Файли, на які посилаються роботи, не зачіпаються.")) { log.textContent = ""; return; }
    let removed = 0;
    for (let i = 0; i < orphans.length; i += 100) {
      const rm = await sb.storage.from(BUCKET).remove(orphans.slice(i, i + 100).map((o) => o.p));
      if (rm.error) throw rm.error;
      removed += (rm.data || []).length;
    }
    log.textContent = removed
      ? "Видалено файлів: " + removed + " з " + orphans.length + " (" + mb + " МБ)."
      : "Supabase нічого не видалив — немає дозволу на видалення. Виконайте SQL №3 з ДОКУМЕНТАЦІЯ.md.";
  } catch (e) {
    console.error(e);
    log.textContent = "Помилка: " + (e && e.message ? e.message : e);
  } finally {
    busy = false;
  }
}

async function removeFiles(paths) {
  if (!paths.length) return null;
  const rm = await sb.storage.from(BUCKET).remove(paths);
  if (rm.error) console.warn("storage remove:", rm.error.message || rm.error);
  return rm.error || null;
}

function blankRow(id, c) {
  return {
    id, cat: c, sort_order: 0, price: 0, year: "", img: "", hidden: false,
    title: "", title_en: "", hall: "", hall_en: "", size: "", size_en: "",
    tech: "", tech_en: "", description: "", description_en: ""
  };
}

// ---------- Items ----------

async function saveItem() {
  if (busy) return;
  if (!(await requireAuth())) return;
  const id = editingId || newId();
  const icat = $("#edCat").value;
  const isProj = icat === "projects";
  const file = $("#edImg").files[0];
  const titleUa = $("#edTua").value.trim();
  const oldImg = editingId ? ($("#edPrev").dataset.current || "") : "";
  if (!titleUa && !isProj) { toast("Вкажіть назву"); return; }
  if (isProj && !file && !oldImg) { toast("Оберіть фото"); return; }
  const btn = $("#edSave");
  btn.disabled = true; busy = true;
  try {
    let img = oldImg;
    if (file) { toast("Стискаю і завантажую фото…", true); img = await uploadPhoto(id, file); }
    const prev = rows.find(x => x.id === id);
    const sort = (prev && (prev.cat || "paintings") === icat) ? (prev.sort_order || 0) : nextOrder(icat);
    const price = Number($("#edPrice").value);
    const hallUa = icat === "paintings" ? $("#edHall").value.trim() : "";
    const hallRow = halls.find(h => h.name === hallUa);
    const techUa = $("#edTech").value.trim();
    const sizeUa = $("#edSize").value.trim();
    const descUa = $("#edDesc").value.trim();
    const titleEn = $("#edTen").value.trim() || titleUa;
    const row = Object.assign(blankRow(id, icat), {
      sort_order: sort, price: isNaN(price) ? 0 : price,
      year: $("#edYear").value.trim(), img, hidden: $("#edHidden").checked,
      title: titleUa, title_en: titleEn,
      hall: hallUa, hall_en: hallUa ? ((hallRow && hallRow.name_en) || HALLS[hallUa] || hallUa) : "",
      size: sizeUa, size_en: sizeUa, tech: techUa, tech_en: techUa,
      description: descUa, description_en: descUa
    });
    const { error } = await sb.from("items").upsert(row, { onConflict: "id" });
    if (error) {
      const alive = await sessionAlive();
      throw new Error("Збереження в базу: " + error.message + (alive ? "" : " — ви не увійшли"));
    }
    if (file && oldImg && oldImg !== img) await removeFiles(storagePaths(id, oldImg));
    toast(prev && (prev.cat || "paintings") !== icat ? "Збережено й перенесено в інший розділ" : "Збережено");
    closeEditor();
    await load();
  } catch (e) {
    console.error(e);
    toast("Помилка: " + (e && e.message ? e.message : e));
  }
  btn.disabled = false; busy = false;
}

async function deleteItem(d) {
  const err = await removeFiles(storagePaths(d.id, d.img));
  const { error } = await sb.from("items").delete().eq("id", d.id);
  if (error) throw error;
  toast("Видалено" + (err ? " (фото не стерлося: " + (err.message || "помилка") + ")" : ""));
}

async function addProjectPhotos(files) {
  if (busy || !files.length) return;
  if (!(await requireAuth())) return;
  busy = true;
  $("#addBtn").disabled = true;
  let done = 0, failed = 0;
  let order = nextOrder("projects");
  for (const f of files) {
    toast("Завантажую фото " + (done + failed + 1) + " з " + files.length + "…", true);
    const id = newId();
    try {
      const img = await uploadPhoto(id, f);
      const { error } = await sb.from("items").upsert(Object.assign(blankRow(id, "projects"), { img, sort_order: order++ }), { onConflict: "id" });
      if (error) { await removeFiles(storagePaths(id, img)); throw error; }
      done++;
    } catch (e) {
      console.error(e);
      failed++;
    }
  }
  busy = false;
  $("#addBtn").disabled = false;
  toast("Додано фото: " + done + (failed ? " · не вдалося: " + failed : ""));
  await load();
}

function renderList(data) {
  const list = data.filter(d => (d.cat || "paintings") === cat).sort(byOrder);
  $("#count").textContent = list.length + " шт.";
  const el = $("#list");
  if (!list.length) {
    el.innerHTML = '<p class="muted">Тут поки порожньо. Натисніть «' + esc($("#addBtn").textContent) + '».</p>';
    return;
  }
  const isProj = cat === "projects";
  el.innerHTML = list.map((d, i) => {
    const title = d.title || (isProj ? "Фото " + (i + 1) : "");
    const sub = isProj ? "" : [d.size, cat === "paintings" ? (d.hall || "без зали") : ""].filter(Boolean).join(" · ");
    const price = isProj ? "" : (d.price ? Number(d.price).toLocaleString("uk-UA") + " грн" : "ціна за запитом");
    return `<div class="item">
      ${d.img ? `<img src="${esc(thumbOf(d.img))}" alt="" loading="lazy">` : '<div class="thumb">◦</div>'}
      <div>
        <div class="t">${esc(title)}${d.hidden ? '<span class="hidden-tag">сховано</span>' : ''}</div>
        ${sub ? `<div class="s">${esc(sub)}</div>` : ""}
        ${price ? `<div class="price">${esc(price)}</div>` : ""}
      </div>
      <div class="ops">
        <button data-act="up" data-id="${esc(d.id)}">↑</button>
        <button data-act="down" data-id="${esc(d.id)}">↓</button>
        <button data-act="hide" data-id="${esc(d.id)}">${d.hidden ? "Показати" : "Сховати"}</button>
        <button data-act="edit" data-id="${esc(d.id)}">Редагувати</button>
        <button data-act="del" data-id="${esc(d.id)}" style="color:#B4501C;">Видалити</button>
      </div>
    </div>`;
  }).join("");
  bindOps(el);
}

function bindOps(el) {
  el.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", async () => {
    const act = b.dataset.act, id = b.dataset.id;
    const d = rows.find(x => x.id === id);
    if (!d) return;
    if (act === "edit") { openEditor(id); return; }
    if (!(await requireAuth())) return;
    if (act === "del") {
      if (!confirm("Видалити «" + (d.title || "фото") + "» безповоротно?")) return;
      try { await deleteItem(d); } catch (e) { toast("Помилка: " + e.message); return; }
      await load();
      return;
    }
    if (act === "hide") {
      const { error } = await sb.from("items").update({ hidden: !d.hidden }).eq("id", id);
      if (error) { toast(error.message); return; }
      toast(d.hidden ? "Показано" : "Сховано");
      await load();
    } else {
      const list = ofCat(cat);
      const i = list.findIndex(x => x.id === id);
      const j = act === "up" ? i - 1 : i + 1;
      if (j < 0 || j >= list.length) return;
      const a = list[i], b2 = list[j];
      let oa = a.sort_order || 0, ob = b2.sort_order || 0;
      if (oa === ob) ob = oa + (act === "up" ? -1 : 1);
      await sb.from("items").update({ sort_order: ob }).eq("id", a.id);
      await sb.from("items").update({ sort_order: oa }).eq("id", b2.id);
      toast("Порядок змінено");
      await load();
    }
  }));
}

function applyCatFields(c) {
  const proj = c === "projects";
  $("#fMain").style.display = proj ? "none" : "";
  $("#fTech").style.display = proj ? "none" : "";
  $("#fDesc").style.display = proj ? "none" : "";
  $("#hallLbl").style.display = c === "paintings" ? "" : "none";
}

function openEditor(id) {
  editingId = id || null;
  const d = id ? rows.find(x => x.id === id) : null;
  const c = d ? (d.cat || "paintings") : cat;
  $("#edCat").value = c;
  applyCatFields(c);
  fillHallSelect(d ? d.hall : "");
  $("#edTitle").textContent = id ? "Редагувати" : NEW_TITLE[c];
  $("#edDelete").style.display = id ? "" : "none";
  $("#edImg").value = "";
  const prev = $("#edPrev");
  prev.style.display = "none"; prev.removeAttribute("data-current");
  $("#edImgNote").style.display = "";
  $("#edTua").value = $("#edTen").value = $("#edPrice").value = $("#edSize").value = $("#edTech").value = $("#edYear").value = $("#edDesc").value = "";
  $("#edHidden").checked = false;
  if (d) {
    $("#edTua").value = d.title || "";
    $("#edTen").value = (d.title_en && d.title_en !== d.title) ? d.title_en : "";
    $("#edPrice").value = d.price || "";
    $("#edSize").value = d.size || "";
    $("#edTech").value = d.tech || "";
    $("#edYear").value = d.year || "";
    $("#edDesc").value = d.description || "";
    $("#edHall").value = d.hall || "";
    $("#edHidden").checked = !!d.hidden;
    if (d.img) { prev.src = thumbOf(d.img); prev.style.display = ""; prev.setAttribute("data-current", d.img); $("#edImgNote").style.display = "none"; }
  }
  $("#editor").style.display = "flex";
}
function closeEditor() { $("#editor").style.display = "none"; editingId = null; }

$("#edCat").addEventListener("change", () => applyCatFields($("#edCat").value));

$("#edImg").addEventListener("change", () => {
  const f = $("#edImg").files[0];
  if (!f) return;
  $("#edPrev").src = URL.createObjectURL(f);
  $("#edPrev").style.display = "";
  $("#edImgNote").style.display = "none";
});

// ---------- Data ----------

async function load() {
  const [itRes, hRes, sRes] = await Promise.all([
    sb.from("items").select("*").order("sort_order", { ascending: true }),
    sb.from("halls").select("*").order("sort_order", { ascending: true }),
    sb.from("settings").select("*")
  ]);
  if (itRes.error) { toast("Помилка: " + itRes.error.message); return; }
  rows = itRes.data || [];
  halls = hRes.error ? [] : (hRes.data || []);
  settingsOk = !sRes.error;
  settings = {};
  (sRes.data || []).forEach((s) => { settings[s.key] = s.value || ""; });
  render();
}

function render() {
  $("#listBar").style.display = cat === "settings" ? "none" : "";
  renderExtra();
  if (cat === "halls") renderHalls();
  else if (cat === "settings") $("#list").innerHTML = "";
  else renderList(rows);
}

const SETTINGS_NOTE = '<p class="note">Це поле запрацює після разового налаштування бази — попросіть Антона (SQL у файлі ДОКУМЕНТАЦІЯ.md, розділ 8).</p>';

function renderExtra() {
  const el = $("#extra");
  if (cat === "projects") {
    el.innerHTML = `<div class="card">
      <h2>Текст над реалізованими проєктами</h2>
      <p class="muted" style="margin-bottom:14px;">Показується на сайті над фото. Порожнє поле — стандартний текст («Ці роботи вже живуть у своїх власників…»).</p>
      ${settingsOk ? "" : SETTINGS_NOTE}
      <label style="margin-top:12px;">Українською<textarea id="stIntro" rows="3" placeholder="Кожну з цих робіт можна повторити за вашим бажанням…">${esc(settings.projects_intro)}</textarea></label>
      <label>Англійською (необов.)<textarea id="stIntroEn" rows="3">${esc(settings.projects_intro_en)}</textarea></label>
      <button class="btn btn-dark" id="stIntroSave" ${settingsOk ? "" : "disabled"}>Зберегти текст</button>
    </div>`;
    $("#stIntroSave").addEventListener("click", () => saveSettings({ projects_intro: $("#stIntro").value.trim(), projects_intro_en: $("#stIntroEn").value.trim() }));
  } else if (cat === "settings") {
    const legacy = rows.filter(r => r.img && !isOptimized(r.img));
    el.innerHTML = `<div class="card">
      <h2>Магазин на Etsy</h2>
      <p class="muted" style="margin-bottom:14px;">Посилання з'явиться в «Контактах» і в кошику з підписом «замовлення з-за кордону». Порожнє поле — Etsy не показується.</p>
      ${settingsOk ? "" : SETTINGS_NOTE}
      <label style="margin-top:12px;">Посилання<input id="stEtsy" type="url" placeholder="https://www.etsy.com/shop/…" value="${esc(settings.etsy_url)}"></label>
      <button class="btn btn-dark" id="stEtsySave" ${settingsOk ? "" : "disabled"}>Зберегти</button>
    </div>
    <div class="card">
      <h2>Пароль до адмінки</h2>
      <p class="muted" style="margin-bottom:14px;">Придумайте свій пароль (мінімум 8 символів). Після зміни входьте вже з новим.</p>
      <div class="grid2">
        <label>Новий пароль<input id="pw1" type="password" autocomplete="new-password"></label>
        <label>Ще раз<input id="pw2" type="password" autocomplete="new-password"></label>
      </div>
      <button class="btn btn-dark" id="pwSave">Змінити пароль</button>
    </div>
    ${legacy.length ? `<div class="card">
      <h2>Оптимізація фото</h2>
      <p class="muted" style="margin-bottom:14px;">Фото, завантажені раніше, важать по 1–3 МБ і гальмують сайт на телефонах. Кнопка перестисне їх (${legacy.length} шт.) — займе кілька хвилин, сторінку не закривайте. Краще робити з комп'ютера.</p>
      <button class="btn btn-dark" id="optBtn">Перестиснути ${legacy.length} фото</button>
      <p class="muted" id="optLog" style="margin-top:10px;"></p>
    </div>` : ""}
    ${TOOLS ? `<div class="card">
      <h2>Сховище фото</h2>
      <p class="muted" style="margin-bottom:14px;">Шукає у сховищі файли, на які вже не посилається жодна робота (старі версії фото, видалені роботи), і прибирає їх.</p>
      <button class="btn btn-line" id="cleanBtn">Знайти й прибрати зайві файли</button>
      <p class="muted" id="cleanLog" style="margin-top:10px;"></p>
    </div>` : ""}`;
    $("#stEtsySave").addEventListener("click", () => {
      const v = $("#stEtsy").value.trim();
      if (v && !/^https?:\/\//i.test(v)) { toast("Посилання має починатися з https://"); return; }
      saveSettings({ etsy_url: v });
    });
    $("#pwSave").addEventListener("click", changePassword);
    if ($("#optBtn")) $("#optBtn").addEventListener("click", optimizeLegacy);
    if ($("#cleanBtn")) $("#cleanBtn").addEventListener("click", cleanupStorage);
  } else {
    el.innerHTML = "";
  }
}

async function changePassword() {
  const p1 = $("#pw1").value, p2 = $("#pw2").value;
  if (p1.length < 8) { toast("Пароль має бути щонайменше 8 символів"); return; }
  if (p1 !== p2) { toast("Паролі не збігаються"); return; }
  if (!(await requireAuth())) return;
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) { toast("Помилка: " + error.message); return; }
  $("#pw1").value = $("#pw2").value = "";
  toast("Пароль змінено");
}

async function saveSettings(obj) {
  if (!(await requireAuth())) return;
  const payload = Object.keys(obj).map((k) => ({ key: k, value: obj[k] }));
  const { error } = await sb.from("settings").upsert(payload, { onConflict: "key" });
  if (error) { toast("Помилка: " + error.message); return; }
  toast("Збережено");
  await load();
}

async function optimizeLegacy() {
  if (busy) return;
  if (!(await requireAuth())) return;
  const legacy = rows.filter(r => r.img && !isOptimized(r.img));
  if (!legacy.length) return;
  busy = true;
  $("#optBtn").disabled = true;
  const log = $("#optLog");
  let done = 0, failed = 0;
  for (const r of legacy) {
    log.textContent = "Обробляю " + (done + failed + 1) + " з " + legacy.length + ": " + (r.title || "фото") + "…";
    try {
      const res = await fetch(r.img, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const img = await uploadPhoto(r.id, await res.blob());
      const { error } = await sb.from("items").update({ img }).eq("id", r.id);
      if (error) { await removeFiles(storagePaths(r.id, img)); throw error; }
      await removeFiles(storagePaths(r.id, r.img));
      done++;
    } catch (e) {
      console.error(r.id, e);
      failed++;
    }
  }
  busy = false;
  log.textContent = "Готово: " + done + (failed ? " · не вдалося: " + failed + " (спробуйте ще раз)" : "");
  toast("Фото оптимізовано: " + done);
  await load();
}

// ---------- Halls ----------

function renderHalls() {
  const list = halls.slice().sort(byOrder);
  $("#count").textContent = list.length + " зал";
  const el = $("#list");
  if (!list.length) { el.innerHTML = '<p class="muted">Зал ще немає. Додайте першу.</p>'; return; }
  el.innerHTML = list.map((h) => {
    const cnt = rows.filter(r => (r.cat || "paintings") === "paintings" && (r.hall || "") === (h.name || "")).length;
    return `<div class="item">
      <div class="thumb" style="font-size:15px;">${esc(h.num || '·')}</div>
      <div>
        <div class="t">${esc(h.name)}</div>
        <div class="s">${cnt} робіт${h.name_en ? " · " + esc(h.name_en) : ""}</div>
      </div>
      <div class="ops">
        <button data-act="up" data-id="${esc(h.id)}">↑</button>
        <button data-act="down" data-id="${esc(h.id)}">↓</button>
        <button data-act="edit" data-id="${esc(h.id)}">Редагувати</button>
        <button data-act="del" data-id="${esc(h.id)}">Видалити</button>
      </div>
    </div>`;
  }).join("");
  bindHallOps(el);
}

async function deleteHall(h) {
  await sb.from("items").update({ hall: "", hall_en: "" }).eq("hall", h.name);
  const { error } = await sb.from("halls").delete().eq("id", h.id);
  if (error) throw error;
  toast("Залу видалено");
}

function bindHallOps(el) {
  el.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", async () => {
    const act = b.dataset.act, id = b.dataset.id;
    const h = halls.find(x => x.id === id);
    if (!h) return;
    if (act === "edit") { openHallEditor(id); return; }
    if (!(await requireAuth())) return;
    if (act === "del") {
      if (!confirm("Видалити залу? Роботи цієї зали стануть «Без зали».")) return;
      try { await deleteHall(h); } catch (e) { toast("Помилка: " + e.message); return; }
      await load();
    } else {
      const list = halls.slice().sort(byOrder);
      const i = list.findIndex(x => x.id === id);
      const j = act === "up" ? i - 1 : i + 1;
      if (j < 0 || j >= list.length) return;
      const a = list[i], b2 = list[j];
      let oa = a.sort_order || 0, ob = b2.sort_order || 0;
      if (oa === ob) ob = oa + (act === "up" ? -1 : 1);
      await sb.from("halls").update({ sort_order: ob }).eq("id", a.id);
      await sb.from("halls").update({ sort_order: oa }).eq("id", b2.id);
      toast("Порядок змінено");
      await load();
    }
  }));
}

function openHallEditor(id) {
  editingHallId = id || null;
  $("#heTitle").textContent = id ? "Редагувати залу" : "Нова зала";
  $("#heDelete").style.display = id ? "" : "none";
  $("#heNum").value = $("#heName").value = $("#heNameEn").value = $("#heNote").value = $("#heNoteEn").value = "";
  if (id) {
    const h = halls.find(x => x.id === id);
    if (h) {
      $("#heNum").value = h.num || "";
      $("#heName").value = h.name || "";
      $("#heNameEn").value = h.name_en || "";
      $("#heNote").value = h.note || "";
      $("#heNoteEn").value = h.note_en || "";
    }
  }
  $("#hallEditor").style.display = "flex";
}
function closeHallEditor() { $("#hallEditor").style.display = "none"; editingHallId = null; }

async function saveHall() {
  if (!(await requireAuth())) return;
  const name = $("#heName").value.trim();
  if (!name) { toast("Вкажіть назву зали"); return; }
  if (halls.some(h => h.name === name && h.id !== editingHallId)) { toast("Зала з такою назвою вже є"); return; }
  const prev = editingHallId ? halls.find(h => h.id === editingHallId) : null;
  const id = editingHallId || newId();
  const row = {
    id, num: $("#heNum").value.trim(), name, name_en: $("#heNameEn").value.trim(),
    note: $("#heNote").value.trim(), note_en: $("#heNoteEn").value.trim(),
    sort_order: prev ? (prev.sort_order || 0) : Number(window._heOrder || 0)
  };
  const { error } = await sb.from("halls").upsert(row, { onConflict: "id" });
  if (error) { toast("Помилка: " + error.message); return; }
  // Works are linked to a hall by its name, so carry a rename (and the English name) over to them.
  if (prev) {
    const up = await sb.from("items").update({ hall: name, hall_en: row.name_en || name }).eq("hall", prev.name);
    if (up.error) { toast("Залу збережено, але роботи не оновились: " + up.error.message); closeHallEditor(); await load(); return; }
  }
  toast("Збережено");
  closeHallEditor();
  await load();
}

$("#heClose").addEventListener("click", closeHallEditor);
$("#heCancel").addEventListener("click", closeHallEditor);
$("#heSave").addEventListener("click", saveHall);
$("#heDelete").addEventListener("click", async () => {
  if (!(await requireAuth())) return;
  if (!editingHallId || !confirm("Видалити залу? Роботи стануть «Без зали».")) return;
  const h = halls.find(x => x.id === editingHallId);
  if (!h) return;
  try { await deleteHall(h); } catch (e) { toast("Помилка: " + e.message); return; }
  closeHallEditor();
  await load();
});

function fillHallSelect(current) {
  const sel = $("#edHall");
  const opts = halls.slice().sort(byOrder).map(h =>
    `<option value="${esc(h.name)}">${h.num ? esc(h.num) + " · " : ""}${esc(h.name)}</option>`
  );
  // Keep an unknown (e.g. renamed outside the admin) hall selectable so saving doesn't silently drop it.
  if (current && !halls.some(h => h.name === current)) opts.push(`<option value="${esc(current)}">${esc(current)} (немає у «Залах»)</option>`);
  sel.innerHTML = '<option value="">Без зали (на сайті — «Інші роботи»)</option>' + opts.join("");
  sel.value = current || "";
}

// ---------- Auth & wiring ----------

$("#loginBtn").addEventListener("click", login);
$("#email").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
$("#pass").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
async function login() {
  const email = $("#email").value.trim(), pass = $("#pass").value;
  $("#loginErr").textContent = "";
  if (!email || !pass) { $("#loginErr").textContent = "Введіть пошту і пароль."; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) $("#loginErr").textContent = "Неправильна пошта або пароль.";
}
$("#logoutBtn").addEventListener("click", () => sb.auth.signOut());
$("#addBtn").addEventListener("click", () => {
  if (cat === "halls") {
    window._heOrder = halls.reduce((m, h) => Math.max(m, h.sort_order || 0), 0) + 1;
    openHallEditor(null);
  } else if (cat === "projects") {
    $("#multiImg").value = "";
    $("#multiImg").click();
  } else {
    openEditor(null);
  }
});
$("#multiImg").addEventListener("change", () => addProjectPhotos([...$("#multiImg").files]));
$("#edClose").addEventListener("click", closeEditor);
$("#edCancel").addEventListener("click", closeEditor);
$("#edSave").addEventListener("click", saveItem);
$("#edDelete").addEventListener("click", async () => {
  if (!editingId || !confirm("Видалити безповоротно?")) return;
  if (!(await requireAuth())) return;
  const d = rows.find(x => x.id === editingId);
  if (!d) return;
  try {
    await deleteItem(d);
    closeEditor();
    await load();
  } catch (e) { toast("Помилка: " + e.message); }
});
$$("#tabs .tab").forEach(t => t.addEventListener("click", () => {
  $$("#tabs .tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  cat = t.dataset.cat;
  $("#addBtn").textContent = cat === "halls" ? "Додати залу" : cat === "projects" ? "Додати фото" : "Додати";
  render();
}));

function setUser(user) {
  $("#login").style.display = user ? "none" : "";
  $("#app").style.display = user ? "" : "none";
  $("#whoami").textContent = user ? "Увійшла: " + (user.email || "") : "";
  if (user) load();
}

async function sessionAlive() {
  const { data } = await sb.auth.getUser().catch(() => ({ data: { user: null } }));
  return !!(data && data.user);
}

async function requireAuth() {
  const alive = await sessionAlive();
  if (!alive) { setUser(null); toast("Сесію завершено — увійдіть заново."); return false; }
  return true;
}

function init() {
  if (!CONFIG_OK) {
    document.body.innerHTML = '<div class="wrap"><div class="card"><h1>Supabase не налаштовано</h1><p class="muted" style="margin-top:10px;">Заповніть <b>supabase-config.js</b> (url та anonKey з налаштувань проєкту).</p></div></div>';
    return;
  }
  sb = window.supabase.createClient(CFG.url, CFG.anonKey);
  sb.auth.getUser().then(({ data }) => setUser(data.user || null)).catch(() => setUser(null));
  sb.auth.onAuthStateChange((_e, session) => setUser(session ? session.user : null));
}
init();
</script>
</body>
